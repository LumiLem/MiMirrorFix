plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xiaomi.mirror.fix.traditional'
    compileSdk 34

    defaultConfig {
        applicationId "com.xiaomi.mirror.fix.traditional"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("SIGNING_KEYSTORE_PATH") ?: project.findProperty("SIGNING_KEYSTORE_PATH")
            if (keystorePath) {
                def keystoreFile = file(keystorePath)
                if (!keystoreFile.isAbsolute()) {
                    keystoreFile = rootProject.file(keystorePath)
                }
                if (keystoreFile.exists()) {
                    storeFile keystoreFile
                    storePassword System.getenv("SIGNING_KEYSTORE_PASSWORD") ?: project.findProperty("SIGNING_KEYSTORE_PASSWORD")
                    keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: project.findProperty("SIGNING_KEY_ALIAS")
                    keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: project.findProperty("SIGNING_KEY_PASSWORD")
                    v1SigningEnabled true
                    v2SigningEnabled true
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}

