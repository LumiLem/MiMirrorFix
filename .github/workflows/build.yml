name: Build & Release MiMirrorFix

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.jks"
        fi

    - name: Build with Gradle
      env:
        SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
        SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: gradle assembleRelease

    - name: Cleanup Keystore
      if: always()
      run: |
        rm -f "${{ github.workspace }}/release.jks"

    - name: Prepare Standard Release Artifacts
      run: |
        TAG_NAME="${GITHUB_REF_NAME:-v1.0}"
        mkdir -p dist
        cp module-libxposed/build/outputs/apk/release/*.apk dist/MiMirrorFix-${TAG_NAME}-libxposed.apk
        cp module-traditional/build/outputs/apk/release/*.apk dist/MiMirrorFix-${TAG_NAME}-traditional.apk

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MiMirrorFix-APKs
        path: dist/*.apk

    - name: Create Draft Release
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        name: "修复小米跨设备通知 ${{ github.ref_name }}"
        draft: true
        prerelease: false
        generate_release_notes: true
        body: |
          ### 修复小米跨设备通知 (MiMirrorFix) ${{ github.ref_name }}

          > **作者**：柠小芒  
          > **描述**：修复低版本 HyperOS/MIUI 跨屏协同通知小窗镜像连接及锁屏密码误报问题

          #### 包含产物说明：
          - **MiMirrorFix-${{ github.ref_name }}-libxposed.apk**：基于现代化 LibXposed API 102 架构（推荐）
          - **MiMirrorFix-${{ github.ref_name }}-traditional.apk**：基于传统 Xposed API 架构
        files: dist/*.apk
